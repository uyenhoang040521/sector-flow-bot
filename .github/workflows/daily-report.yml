name: Daily sector flow report

on:
  schedule:
    - cron: "0 0 * * *"      # 07:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python flowbot.py

      - name: Show report in job summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report & history
        run: |
          git config user.name "sector-flow-bot"
          git config user.email "sector-flow-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "report: $(date -u +%F)"
          git push
